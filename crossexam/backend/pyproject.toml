[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crossexam-backend"
version = "0.1.0"
description = "CrossExam voice-agent backend: a LiveKit voice agent that interrogates large documents using Moss sub-10ms in-process semantic retrieval."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "CrossExam" }]
dependencies = [
    # 1.x is the current stable line (verified 2026-06: PyPI livekit-agents 1.5.x).
    # The code uses the 1.x API: AgentSession, Agent, on_user_turn_completed, and
    # livekit.plugins.turn_detector.multilingual.MultilingualModel.
    "livekit-agents>=1.0,<2.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<1.0",
    # Pinned so ruff/mypy can run STRICT and reproducibly in CI and on-site.
    "ruff==0.15.0",
    "mypy==1.19.1",
]
# Real-time voice pipeline plugins (STT / LLM / TTS + VAD). Optional so the
# mock/test path installs and runs without them; required only for a live
# voice session. Install with: pip install 'crossexam-backend[voice]'.
# All plugins track the livekit-agents 1.x line (verified 2026-06 on PyPI:
# deepgram 1.5.x, openai 1.5.x, cartesia 1.4.x, silero 1.5.x). The
# turn-detector model (livekit.plugins.turn_detector.multilingual) ships in the
# livekit-plugins-turn-detector package (1.5.x) used by server.py.
voice = [
    "livekit-plugins-deepgram>=1.5,<2.0",
    "livekit-plugins-openai>=1.5,<2.0",
    "livekit-plugins-cartesia>=1.5,<2.0",
    "livekit-plugins-silero>=1.5,<2.0",
    "livekit-plugins-turn-detector>=1.5,<2.0",
]
# HTTP API service (token minting + document upload). Optional so the worker /
# test path installs without web deps; required to run `crossexam-api`. The
# document-ingest path also needs `pdfplumber` (for the real PDF text-layer
# parse). Install with: pip install 'crossexam-backend[api]'.
api = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.27,<1.0",
    "python-multipart>=0.0.9,<1.0",
    # livekit-api 1.x matches the livekit-agents 1.x line (verified 2026-06:
    # PyPI livekit-api 1.1.x). Provides `from livekit import api` -> AccessToken.
    "livekit-api>=1.0,<2.0",
    "pdfplumber>=0.10,<1.0",
]
# Real Moss retrieval SDK (sub-10ms in-process hybrid retrieval). Optional: the
# mock/test path runs fully WITHOUT it (deterministic MockIndex). Install + set
# MOSS_PROJECT_ID/MOSS_PROJECT_KEY only for the live retrieval path. The import
# package is resolved as `moss` then (legacy) `inferedge_moss`. Install with:
# pip install 'crossexam-backend[moss]'.
moss = [
    "moss>=1.4.0",
]
# Optional cross-encoder reranker. The default LexicalReranker is zero-dependency
# and always available; install this extra only to enable CrossEncoderReranker
# (a sentence-transformers cross-encoder). Install with:
# pip install 'crossexam-backend[rerank]'.
rerank = [
    "sentence-transformers>=2.2,<4.0",
]
# Real RAGAS faithfulness path for the eval harness. Optional: the eval + bench
# suite runs fully offline (deterministic claim-token groundedness) without it;
# install + set OPENAI_API_KEY only for LLM-judged faithfulness. The default
# `make eval` / CI gate needs NO keys. Install with:
# pip install 'crossexam-backend[eval]'.
eval = [
    "ragas>=0.1,<1.0",
    "datasets>=2.0,<4.0",
]
# Observability: OpenTelemetry spans exported to Langfuse for the hot path
# (retrieve -> verify -> publish). Optional and OFF by default: the mock/test
# path runs with a zero-overhead no-op tracer and needs NO keys. Install + set
# OBS_ENABLED=true and LANGFUSE_PUBLIC_KEY/LANGFUSE_SECRET_KEY to export traces.
# Install with: pip install 'crossexam-backend[obs]'.
obs = [
    "opentelemetry-sdk>=1.20,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20,<2.0",
    "langfuse>=2.0,<4.0",
]

[project.scripts]
crossexam-worker = "crossexam_backend.server:main"
crossexam-doctor = "crossexam_backend.doctor:main"
crossexam-api = "crossexam_backend.api:main"
crossexam-eval = "crossexam_backend.eval.run_eval:main"
crossexam-bench = "crossexam_backend.eval.bench:main"

[tool.setuptools.packages.find]
include = ["crossexam_backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# ANN101/ANN102 were removed in ruff >=0.13, so they are no longer listed here.
select = ["E", "F", "I", "B", "UP", "ANN", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
