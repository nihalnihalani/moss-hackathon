[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crossexam-pipeline"
version = "0.1.0"
description = "CrossExam offline document pipeline: turns a PDF into Moss-indexable chunks with page numbers, word-level citations, bounding boxes, and confidence scores via Unsiloed Parse/Extract."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "CrossExam" }]
dependencies = [
    "pydantic>=2.6,<3.0",
    "typer>=0.12,<1.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
# Local, network-free PDF tooling: generate the sample deposition PDF
# (reportlab) and parse a born-digital PDF's text layer (pdfplumber bundles
# pypdf/pdfminer). Kept optional so the core install stays lean.
pdf = [
    "reportlab>=4.0,<5.0",
    "pypdf>=4.0,<6.0",
    "pdfplumber>=0.11,<1.0",
]
# Real Moss index build. The in-process SDK (no REST surface). Kept optional so
# the offline disk/mock path and CI run without it. See build_index._create_moss_index.
moss = ["inferedge-moss>=1.0.0b19"]
dev = [
    "pytest>=8.0,<10.0",
    "ruff==0.15.0",
    "mypy==1.19.1",
    "reportlab>=4.0,<5.0",
    "pypdf>=4.0,<6.0",
    "pdfplumber>=0.11,<1.0",
]

[project.scripts]
crossexam-pipeline = "crossexam_pipeline.cli:app"

[tool.setuptools.packages.find]
include = ["crossexam_pipeline*"]

[tool.setuptools.package-data]
crossexam_pipeline = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "D"]
# B008: Typer's documented idiom passes typer.Option(...)/typer.Argument(...)
# as parameter defaults; flagging it would fight the framework, so it is
# ignored globally.
ignore = ["D203", "D213", "B008"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
