# =============================================================================
# CrossExam — local/dev compose stack
#   docker compose up --build
# Runs entirely in mock mode when .env has no Moss/LiveKit keys.
# =============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: crossexam-backend:local
    # The voice worker. With keys present it connects to LiveKit; without keys
    # it boots the mock retrieval index and prints guidance (does not crash).
    env_file:
      # Optional: the stack runs in mock mode if .env is absent. Copy
      # .env.example -> .env to provide real Moss/LiveKit credentials.
      - path: .env
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Moss live-retrieval config. Forwarded from the host env / .env so the
      # image (built with the [moss] extra) can run the REAL in-process Moss
      # path. Leave MOSS_PROJECT_ID/KEY blank to stay in mock mode. No secrets
      # are hardcoded; only non-sensitive tuning has defaults.
      USE_MOCKS: ${USE_MOCKS:-}
      MOSS_PROJECT_ID: ${MOSS_PROJECT_ID:-}
      MOSS_PROJECT_KEY: ${MOSS_PROJECT_KEY:-}
      MOSS_INDEX_NAME: ${MOSS_INDEX_NAME:-crossexam-documents}
      MOSS_MODEL_ID: ${MOSS_MODEL_ID:-moss-minilm}
      MOSS_AUTO_REFRESH: ${MOSS_AUTO_REFRESH:-false}
      MOSS_REFRESH_INTERVAL_S: ${MOSS_REFRESH_INTERVAL_S:-600}
      MOSS_JOB_TIMEOUT_S: ${MOSS_JOB_TIMEOUT_S:-120}
      MOSS_JOB_POLL_INTERVAL_S: ${MOSS_JOB_POLL_INTERVAL_S:-1}
    restart: unless-stopped

  api:
    # The FastAPI HTTP service the browser talks to: mints LiveKit tokens and
    # ingests uploaded PDFs (token + /documents + /config + /healthz). Reuses the
    # same backend image (built with the [api,voice] extras) but runs the
    # `crossexam-api` entrypoint instead of the worker.
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: crossexam-backend:local
    entrypoint: ["crossexam-api"]
    command: []
    env_file:
      - path: .env
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Same Moss live-retrieval pass-through as the worker (see backend above):
      # POST /documents upserts to the real Moss index when these are set.
      USE_MOCKS: ${USE_MOCKS:-}
      MOSS_PROJECT_ID: ${MOSS_PROJECT_ID:-}
      MOSS_PROJECT_KEY: ${MOSS_PROJECT_KEY:-}
      MOSS_INDEX_NAME: ${MOSS_INDEX_NAME:-crossexam-documents}
      MOSS_MODEL_ID: ${MOSS_MODEL_ID:-moss-minilm}
      MOSS_AUTO_REFRESH: ${MOSS_AUTO_REFRESH:-false}
      MOSS_REFRESH_INTERVAL_S: ${MOSS_REFRESH_INTERVAL_S:-600}
      MOSS_JOB_TIMEOUT_S: ${MOSS_JOB_TIMEOUT_S:-120}
      MOSS_JOB_POLL_INTERVAL_S: ${MOSS_JOB_POLL_INTERVAL_S:-1}
    ports:
      - "8000:8000"
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # VITE_* are compile-time; forward them so a `docker compose build` bakes
      # the right config into the static bundle. VITE_API_URL points the SPA at
      # the `api` service; default to the host-published port for local runs.
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_LIVEKIT_URL: ${VITE_LIVEKIT_URL:-}
        VITE_LIVEKIT_TOKEN: ${VITE_LIVEKIT_TOKEN:-}
        VITE_PDF_URL: ${VITE_PDF_URL:-}
        VITE_MOCK_MODE: ${VITE_MOCK_MODE:-}
    image: crossexam-frontend:local
    ports:
      - "5173:80"
    depends_on:
      - api
      - backend
    restart: unless-stopped
