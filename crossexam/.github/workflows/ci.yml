name: CI

# CrossExam CI — must be green WITHOUT any real API keys.
# Every suite runs in mock mode (Moss/LiveKit creds absent => in-memory mocks).

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  backend:
    name: backend (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crossexam/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Strict gates: ruff and mypy are pinned (ruff==0.15.0, mypy==1.19.1) and clean.
      - name: Ruff (lint)
        run: ruff check crossexam_backend
      - name: Mypy (types)
        run: mypy crossexam_backend
      - name: Pytest
        run: pytest

  # ---------------------------------------------------------------------------
  pipeline:
    name: pipeline (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crossexam/pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Strict gates: ruff and mypy are pinned and clean.
      - name: Ruff (lint)
        run: ruff check crossexam_pipeline
      - name: Mypy (types)
        run: mypy crossexam_pipeline
      - name: Pytest
        run: pytest

  # ---------------------------------------------------------------------------
  frontend:
    name: frontend (node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crossexam/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crossexam/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
      - name: Vitest
        run: npm test
      - name: Build (vite)
        run: npm run build
